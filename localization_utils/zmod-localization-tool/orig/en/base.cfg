        RESPOND PREFIX="info" MSG="{ zlocale('MSG_CLOSING_DIALOG_W') }"
        RUN_SHELL_COMMAND CMD=close_dialogs
        RESPOND PREFIX="info" MSG="{ zlocale('MSG_FAILED_TO_CLOSE') }"
    {% else %}
        FAST_CLOSE_DIALOGS
    {% endif %}

[gcode_macro FAST_CLOSE_DIALOGS]
