    RESPOND TYPE=command MSG="{ zlocale('MSG_ACTIONPROMPT_27') }"
    RESPOND TYPE=command MSG="{ zlocale('MSG_ACTIONPROMPT_28') }"
    RESPOND TYPE=command MSG="{ zlocale('MSG_ACTIONPROMPT_F_6') }"
